<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>For my baby</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="layout">

    <main id="game">
      <div id="question" class="box"></div>
      <p id="reaction"></p>
      <div id="options"></div>
      <button id="next" hidden>Next</button>
    </main>

    <aside id="player">
      <iframe
        title="Songs for you"
        src="https://open.spotify.com/embed/playlist/66ITYHB6foSdCq7fMXZCkN?utm_source=generator"
        width="100%" height="352" style="border:0; border-radius:12px;"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"></iframe>
    </aside>

  </div>

  <button id="secret" aria-label="A little surprise">&#9829;</button>
  <audio id="song" src="kitkat.mp3" preload="none"></audio>

  <script>
    // ===== EDIT THIS PART =====

    // 1) THE LAST SCREEN (put your real paragraph in text).
    //    Leave link as "" if you don't want a button.
    const ENDING = {
      text: "Happy birthday! Your paragraph goes here.",
      link: "",
      linkLabel: "Open your surprise"
    };

    // 2) YOUR QUESTIONS. Put final: true on ONE option per question.
    const QUESTIONS = [
      {
        text: "Whose birthday is it?",
        options: [
          { text: "Diamond😋",     reaction: "Nope, incorrect" },
          { text: "Kitkat🍫",      reaction: "Almost theree!!" },
          { text: "My goodboy !!", reaction: "warmer...." },
          { text: "Mory's kitty",  reaction: "There it is. good boy!! thats more like it", final: true }
        ]
      },
      {
        text: "Do you like being teased?",
        options: [
          { text: "No, Fuck you",            reaction: "bad kitty!!" },
          { text: "i hate you so much",      reaction: "i love you even more darling" },
          { text: "Yes daddy tease me more 🥺🥺", reaction: ";3", final: true },
          { text: "...",                     reaction: "Hint: its the 3rd option!!" }
        ]
      },
      {
        // Slot 3: another tease
        text: "Okay!! if you say so, Whos my good obedient lil kitty?? hmm?",
        options: [
          { text: "ME ME !! ;3 ", reaction: "THERE U GO BABY!!", final: true },
          { text: "meeeeee", reaction: "cmonn u gotta be exicted" },
          { text: "no.", reaction: "why nott" },
          { text: "Smh", reaction: "whats wronggg?" }
        ]
      },
      {
        // Slot 4: every option is a compliment
        text: "Are you a...",
        options: [
          { text: "Pretty girl", reaction: "yes you are!" },
          { text: "very pretty girl!", reaction: "mhmm" },
          { text: "gorgeous girl!!", reaction: "very gorgeous i love your eyes btw" },
          { text: "perfect princess ;3", reaction: "yes you're my perfect princess mwahmwah", final: true }
        ]
      },
      {
        // Slot 5: the sweet, sincere one
        text: "uhhhh",
        options: [
          { text: "Secret!", reaction: "i love your eyes" },
          { text: "secret 2", reaction: "have u checked the corners yet?" },
          { text: "secret 3!!", reaction: "uhm im very creative i know also check the right bottom corner!!" },
          { text: "i love you ", reaction: "i love you more!!", final: true }
        ]
      },
      {
        // Slot 6: something absurd
        text: "Do you like the embed",
        options: [
          { text: "Yes i love it!!", reaction: "aww im glad" },
          { text: "no i totally dont!!", reaction: "tsundere smh" },
          { text: "yes but i love the corner more!!", reaction: "YAYYY", final: true },
          { text: "..", reaction: "sorry i couldnt come up w an option was too busy thinking abt your belly mmh" }
        ]
      },
      {
        // Slot 7: playful, right before the ending
        text: "Do you like the website?!",
        options: [
          { text: "no you should've bought me something", reaction: "im going to spank the brat out of u" },
          { text: "YESS I LOVE IT SM", reaction: "im gladd i love you so much too sorry i couldnt do anything more" },
          { text: "just marry me already", reaction: "okayy hope u dont mind a diamond on your finger" },
          { text: "No you should've invested in stocks and came to thai!!", reaction: "wait how'd u know my plan...", final: true }
        ]
      }
    ];
    // ===== END OF THE PART YOU EDIT =====


    // Grab the page elements we need to change.
    const questionEl = document.getElementById("question");
    const reactionEl = document.getElementById("reaction");
    const optionsEl  = document.getElementById("options");
    const nextBtn    = document.getElementById("next");

    // Which question we're on (0 = the first one).
    let current = 0;

    // Draw the current question and its option buttons.
    function showQuestion() {
      const q = QUESTIONS[current];
      questionEl.textContent = q.text;
      reactionEl.textContent = "";
      nextBtn.hidden = true;
      optionsEl.innerHTML = "";

      q.options.forEach(function (opt, i) {
        const b = document.createElement("button");
        b.className = "option";
        b.textContent = (i + 1) + ". " + opt.text;
        b.addEventListener("click", function () { pick(b, opt); });
        optionsEl.appendChild(b);
      });
    }

    // Runs when she clicks an option.
    function pick(button, opt) {
      reactionEl.textContent = opt.reaction;
      button.disabled = true;

      if (opt.final) {
        // Right one: highlight it and reveal Next. The others stay clickable.
        button.classList.add("picked");
        nextBtn.hidden = false;
      } else {
        // Any other one: show its reaction and fade it out.
        button.classList.add("gone");
      }
    }

    // Move on to the next question, or to the ending.
    nextBtn.addEventListener("click", function () {
      if (nextBtn.hidden) { return; }   // do nothing until a right answer is picked
      current++;
      if (current < QUESTIONS.length) {
        showQuestion();
      } else {
        showEnding();
      }
    });

    function showEnding() {
      questionEl.textContent = ENDING.text;
      reactionEl.textContent = "";
      nextBtn.hidden = true;
      optionsEl.innerHTML = "";

      if (ENDING.link) {
        const a = document.createElement("a");
        a.className = "option";
        a.href = ENDING.link;
        a.textContent = ENDING.linkLabel;
        optionsEl.appendChild(a);
      }
    }

    showQuestion();

    // ----- The secret button: swaps Spotify for your song, and back -----
    const secretBtn = document.getElementById("secret");
    const song = document.getElementById("song");
    const playerBox = document.getElementById("player");
    const playerFrame = document.querySelector("#player iframe");

    // Remember the player's address so we can restore it.
    const playerSrc = playerFrame.src;

    secretBtn.addEventListener("click", function () {
      if (song.paused) {
        playerFrame.src = "about:blank";
        playerBox.hidden = true;
        song.play();
      } else {
        song.pause();
        playerFrame.src = playerSrc;
        playerBox.hidden = false;
      }
    });
  </script>

</body>
</html>
